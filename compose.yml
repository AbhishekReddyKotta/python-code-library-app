---
services:
  db:
    image: arkotta27/python-code-library-db:v${BUILD_NUMBER}
    deploy:
      replicas: 3
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: arkotta27/python-code-library-auth:v${BUILD_NUMBER}
    deploy:
      replicas: 3
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: arkotta27/python-code-library-book:v${BUILD_NUMBER}
    deploy:
      replicas: 3
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: arkotta27/python-code-library-borrow:v${BUILD_NUMBER}
    deploy:
      replicas: 3
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: arkotta27/python-code-library-app:v${BUILD_NUMBER}
    deploy:
      replicas: 3
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
